name: ktlint

on:
  pull_request:
  push:
    branches:
      - develop-native

jobs:
  changes:
    name: Detect Kotlin changes
    runs-on: ubuntu-latest
    outputs:
      kotlin: ${{ steps.filter.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            kotlin:
              - "androidApp/**"
              - "sharedLogic/**"
              - "sharedUI/**"
              - "gradle/**"
              - "build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle.properties"
              - ".editorconfig"
              - ".github/workflows/ktlint.yaml"

  ktlint:
    name: Kotlin (ktlint)
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew ktlintCheck
