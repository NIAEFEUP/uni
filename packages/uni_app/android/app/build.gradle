plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.plugin.compose"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "pt.up.fe.ni.uni"

    compileSdkVersion 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17

        // This is required by flutter_local_notifications. See its README.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "pt.up.fe.ni.uni"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
        debug {
            applicationIdSuffix ".dev"
        }
        profile {
            applicationIdSuffix ".profile"
        }
    }

    buildFeatures {
        compose = true
    }
}

flutter {
    source "../.."
}

configurations {
    debugImplementation {
        exclude group: 'io.objectbox', module: 'objectbox-android'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.04.01')
    implementation composeBom

    implementation "androidx.glance:glance-appwidget:1.2.0-rc01"
    implementation "androidx.glance:glance-material3:1.2.0-rc01"

    implementation "com.google.code.gson:gson:2.14.0"

    // Crucial: Glance relies on these runtimes
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.runtime:runtime"

    // Force DataStore 1.1.1+ to fix 16KB RELRO alignment issue
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "androidx.datastore:datastore:1.1.1"

    implementation "io.objectbox:objectbox-android:5.4.2"
    debugImplementation("io.objectbox:objectbox-android-objectbrowser:5.4.2")

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
